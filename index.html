<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#170d2b">
<title>Afinaro · Ouve e repete</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Afinaro">
</head>
<body>
<header class="top">
  <div class="brand"><img src="logo.png" alt="">Afinaro</div>
  <div class="stats"><span id="streak" title="Dias seguidos">🔥 0</span><span id="xp" title="Estrelas">⭐ 0</span><button id="soundBtn" class="icon" title="Voz do professor">🔊</button></div>
</header>

<main>
  <!-- INÍCIO -->
  <section id="scrHome" class="scr active">
    <div class="hero card">
      <img class="heroLogo" src="logo.png" alt="Afinaro">
      <h1>Ouve e repete</h1>
      <p>Eu canto uma nota ou uma pequena frase, tu repetes. Vês a tua voz em tempo real e eu explico-te o que aconteceu.</p>
      <button id="startBtn" class="big primary">▶ Começar a aula</button>
      <p id="micErr" class="err"></p>
    </div>
    <div class="card">
      <h2>O teu caminho</h2>
      <div id="levelMap" class="levels"></div>
    </div>
    <div class="row wrap">
      <button id="freeBtn" class="big">🎧 Prática livre</button>
      <button id="rangeBtn" class="big">📏 Refazer teste de extensão</button>
      <button id="tutBtn" class="big">❓ Como funciona</button>
    </div>
    <div class="card small"><label class="chk"><input type="checkbox" id="speakToggle" checked> 🔊 Professor fala em voz alta</label> <button id="testVoice">Testar voz</button><div id="voiceInfo" class="sub"></div></div>
  </section>

  <!-- PALCO (aula, extensão, prática livre) -->
  <section id="scrStage" class="scr">
    <div class="stageHead">
      <button id="backBtn" class="icon">←</button>
      <div><div id="stageTitle" class="stageTitle">Aula</div><div id="stageSub" class="sub"></div></div>
      <div id="stars" class="starsBox"></div>
    </div>
    <div class="laneWrap">
      <canvas id="lane"></canvas>
      <div id="phaseBadge" class="phase">—</div>
      <div id="countdown" class="countdown hidden">3</div>
    </div>
    <div class="liveRow">
      <div class="liveNote"><div id="liveNote" class="ln">—</div><div id="liveCents" class="sub">a ouvir…</div></div>
      <div class="meter"><div class="mtrack"><div id="needle"></div></div><div class="scale"><span>baixo</span><span>certo</span><span>alto</span></div></div>
      <div class="vol"><div id="volBar"></div></div>
    </div>
    <div id="tipBox" class="tipBox"><span class="tipIcon">💡</span><span id="tipText">Dica: senta-te ou fica de pé com as costas direitas e os ombros soltos.</span></div>
    <div id="teacher" class="teacher">🧑‍🏫 <span id="teacherText">Olá!</span></div>
    <div class="row wrap center" id="stageBtns">
      <button id="replayBtn" class="big">🔁 Ouvir outra vez</button>
      <button id="nextBtn" class="big primary hidden">Continuar ▶</button>
    </div>
  </section>
</main>

<!-- TUTORIAL -->
<div id="tut" class="overlay hidden">
  <div class="tutCard card">
    <div id="tutArt" class="tutArt"></div>
    <h2 id="tutTitle"></h2>
    <p id="tutText"></p>
    <div class="row center"><button id="tutSkip">Saltar</button><button id="tutNext" class="primary big">Seguinte</button></div>
    <div id="tutDots" class="dots"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
